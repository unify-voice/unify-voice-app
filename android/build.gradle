buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

apply plugin: "com.facebook.react.rootproject"

// RN 0.81+ removed the Kotlin synthetic `currentActivity` property.
// react-native-audio-recorder-player 3.6.10 still references it.
subprojects { subproject ->
    if (subproject.name != "react-native-audio-recorder-player") {
        return
    }

    subproject.afterEvaluate {
        def moduleFile = subproject.file("src/main/java/com/dooboolab.audiorecorderplayer/RNAudioRecorderPlayerModule.kt")
        subproject.tasks.named("preBuild").configure {
            doFirst {
                if (!moduleFile.exists()) {
                    return
                }
                def text = moduleFile.getText("UTF-8")
                def patched = text
                        .replace("(currentActivity)!!", "getCurrentActivity()!!")
                        .replace("currentActivity!!.applicationContext", "reactApplicationContext")
                if (patched != text) {
                    moduleFile.write(patched, "UTF-8")
                }
            }
        }
    }
}
